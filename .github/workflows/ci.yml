name: StoreForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler.name }}, Ubuntu 22.04)
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: "GCC 11"
            cc: gcc-11
            cxx: g++-11
            install_pkg: "gcc-11 g++-11"
          - name: "Clang 14"
            cc: clang-14
            cxx: clang++-14
            install_pkg: "clang-14"

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: storeforge_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libpq-dev libpqxx-dev ${{ matrix.compiler.install_pkg }} postgresql-client

      - name: Apply Database Schema and Seed Data
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d storeforge_db -f sql/schema.sql
          psql -h localhost -U postgres -d storeforge_db -f sql/seed.sql

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTOREFORGE_BUILD_TESTS=ON \
            -DSTOREFORGE_ENABLE_POSTGRES=ON

      - name: Build StoreForge Library and Targets
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Run GoogleTest Suite (CTest)
        run: |
          ctest --test-dir build --output-on-failure --verbose

      - name: Smoke Test CLI Executable
        run: |
          ./build/storeforge_cli --test-run
